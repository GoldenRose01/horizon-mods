id = "elevators"
kind = "mod"
name = "BetterVanilla+ — Elevators"
summary = "Vertical elevators for Horizon 26.3 based on vanilla wool and chiseled blocks."
description = """Vertical elevators for Horizon 26.3, built in Rust as a sandboxed WebAssembly mod.

## Features
- Adds elevator blocks based on all 16 wool colors plus copper and chiseled stone, nether, deepslate, tuff, quartz, sandstone, and resin variants.
- Right-click an elevator to teleport to the nearest elevator above it; sneak + right-click to teleport to the nearest elevator below it (same X/Z, within 128 blocks, requiring 2 clear blocks above).
- Custom `elevators` namespace textures and models, plus shapeless crafting recipes (base block + Ender Pearl + Redstone).
- Original implementation in Rust on `horizon-mod-api` (API 0.2, WebAssembly, side `both`)."""
