id = "enchlib"
kind = "mod"
name = "EnchLib — Horizon"
summary = "Operator commands for inspecting and editing enchantments on Horizon."
description = """Operator commands for inspecting, adding, removing, and managing item enchantments and durability on Horizon 26.3.

## Commands (`/plusec`)
- `/plusec add <id> [level]` — add or update an enchantment on the held item.
- `/plusec remove <id>` — remove an enchantment.
- `/plusec info <id>` / `/plusec list` — inspect enchantment details and active/stored enchantments.
- `/plusec clear` / `/plusec repair` / `/plusec setdurability <percent>` / `/plusec damage <delta>` — manage enchantments and item durability.

Written in Rust as a sandboxed WebAssembly server-side mod on `horizon-mod-api` (API 0.2)."""
