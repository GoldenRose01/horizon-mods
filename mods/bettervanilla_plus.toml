id = "bettervanilla_plus"
kind = "mod"
name = "BetterVanilla+"
summary = "Elevators, cauldron conversions, beacon saturation, treecut, and personal keepinventory for Horizon 26.3."
description = """BetterVanilla+ for Horizon 26.3, built in Rust as a sandboxed WebAssembly mod.

## Features
- **Elevators:** 29 wool, copper, and chiseled block variants with vertical teleportation (right-click up, sneak + right-click down, 128-block range) and shapeless crafting recipes.
- **Cauldron conversions:** drop dirt, coarse dirt, rooted dirt, or any concrete powder color into a water cauldron to convert it to mud or concrete.
- **Beacon Saturation:** drop a Golden Apple on top of a level 4 beacon with Regeneration to grant Saturation V to nearby players within 50 blocks.
- **TreeCut & KeepInventory:** sneak-felling/chopping trees with `/gameset treecut <off|fell|chop>` and per-player keep-inventory with `/gameset player keepinventory <on|off> <player>`."""
