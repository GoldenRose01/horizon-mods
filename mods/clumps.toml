id = "clumps"
kind = "mod"
name = "Clumps"
summary = "Clumps XP orbs together."
description = """
A Horizon WebAssembly port of [Clumps](https://github.com/jaredlll08/Clumps) by Jaredlll08 (MIT License).

- Merges nearby experience orbs regardless of their XP value or entity ID (`experience_orb_can_merge`).
- Preserves exact combined XP totals across different-valued orbs, including remainder tracking above `i16::MAX` (`experience_orb_merge`).
- Removes the XP pickup cooldown (`set_exp_cooldown(0)`) so clumped orbs are collected immediately (`pickup_xp`).

Original mod: https://github.com/jaredlll08/Clumps (Jaredlll08, MIT License).
"""
authors = ["Jaredlll08", "GoldenRose01"]
